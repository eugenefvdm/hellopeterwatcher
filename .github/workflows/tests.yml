name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run tests
        env:
          ENABLE_SMS_TEST: ${{ secrets.ENABLE_SMS_TEST }}
          BULKSMS_USERNAME: ${{ secrets.BULKSMS_USERNAME }}
          BULKSMS_PASSWORD: ${{ secrets.BULKSMS_PASSWORD }}
          BULKSMS_RECIPIENTS: ${{ secrets.BULKSMS_RECIPIENTS }}
        run: ./vendor/bin/pest
